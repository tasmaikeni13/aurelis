[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelis"
version = "0.1.0"
description = "AURELIS reference implementation and Cloud TPU v4 pod research substrate"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "jax>=0.4.30",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.0",
]
tpu = [
  "jax[tpu]",
  "libtpu",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurelis*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
