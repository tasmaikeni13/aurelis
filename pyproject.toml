[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelis-theory"
version = "0.1.0"
description = "Theory, numerical analysis, and formal proofs for AURELIS"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.5",
  "numpy==2.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["analysis"]
