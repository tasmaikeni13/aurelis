[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelis"
version = "0.1.0"
description = "AURELIS reference implementation and ROCm research substrate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.3.2",
  "torch>=2.8,<2.9",
]

[project.optional-dependencies]
dev = [
  "matplotlib==3.10.5",
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurelis*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
