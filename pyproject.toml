[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csm-research"
version = "0.1.0"
description = "Falsification-first reference experiments for Conjugate State Machines"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

